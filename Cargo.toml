[workspace]
resolver = "3"
members = ["crates/delta-core", "crates/agy-delta"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
delta-core = { path = "crates/delta-core" }
anyhow = "1"
clap = { version = "=4.5.49", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
